<mat-tree
  [dataSource]="dataSource"
  [treeControl]="treeControl"
  class="example-tree"
>
  <!-- Leaf node template -->
  <mat-tree-node *matTreeNodeDef="let node" matTreeNodeToggle
    [draggable]="isLecturer && !isMandatoryNode(node) && !node.TestId"
    (dragstart)="onDragStart($event, node)"
    (dragover)="onDragOver($event, node)"
    (dragleave)="onDragLeave($event)"
    (drop)="onDrop($event, node)"
    (dragend)="onDragEnd($event)"
  >
    <li class="mat-tree-node">
      <button class="invisible" mat-icon-button></button>
      <mat-icon
        class="expandable-external"
        [ngClass]="{
          folder_file_icons: node.FilePath != null,
          'empty-tree-icon': node.FilePath == null && !node.TestId
        }"
      >
        <ng-container>
          {{ node.TestId !== null ? 'event_available' : 'event_note' }}
        </ng-container>
      </mat-icon>
      <a
        class="btn clickable"
        *ngIf="node.FilePath"
        (click)="openPDF(node.Id, node.FilePath)"
      >
        {{ node.Name }}
      </a>
      <a class="btn clickable" *ngIf="node.TestId" (click)="openTest(node)">
        {{ node.Name }}
      </a>
      <span
        class="btn"
        [ngClass]="{
          'non-clickable': !hasContent(node),
          'non-clickable-filled': hasContent(node)
        }"
        *ngIf="!isLeafClickable(node)"
        [matTooltip]="'complex.noInfo' | translate: 'Отсутствует информация по теме'"
        [matTooltipDisabled]="hasContent(node)"
        matTooltipPosition="right"
      >
        {{ node.Name }}
      </span>
      <div class="work-icons" *ngIf="isLecturer">
        <a
          class="btn clickable"
          (click)="openMonitoring(node.Id, node.Name)"
          [matTooltip]="
            'complex.adaptiveTopic' | translate: 'Мониторинг по теме'
          "
          matTooltipPosition="below"
          *ngIf="node.FilePath"
        >
          <span class="btn clickable"
            ><mat-icon class="icon">access_time</mat-icon></span
          >
        </a>
        <a
          class="btn clickable"
          (click)="openEditPopup(node)"
          [matTooltip]="'common.edit' | translate: 'Редактировать'"
          matTooltipPosition="below"
          *ngIf="!node.TestId"
        >
          <span class="btn clickable"
            ><mat-icon class="icon">edit</mat-icon></span
          >
        </a>
        <a
          class="btn clickable"
          (click)="openConfirmationDialog(node.Id, node)"
          [matTooltip]="'common.delete' | translate: 'Удалить'"
          matTooltipPosition="below"
        >
          <span class="btn clickable"
            ><mat-icon class="icon">delete</mat-icon></span
          >
        </a>
      </div>
    </li>
    <div class="drop-indicator" *ngIf="dropIndicatorNodeId === +node.Id"></div>
  </mat-tree-node>

  <!-- Expandable node template -->
  <mat-nested-tree-node *matTreeNodeDef="let node; when: hasChild"
    [draggable]="isLecturer && !isMandatoryNode(node) && !node.TestId"
    (dragstart)="onDragStart($event, node)"
    (dragover)="onDragOver($event, node)"
    (dragleave)="onDragLeave($event)"
    (drop)="onDrop($event, node)"
    (dragend)="onDragEnd($event)"
    [class.drop-inside]="dropInsideNodeId === +node.Id"
  >
    <li>
      <div class="mat-tree-node">
        <button
          mat-icon-button
          matTreeNodeToggle
          [attr.aria-label]="'toggle ' + node.name"
          class="complex-three-title-button"
        >
          <span class="complex-three-title-prefix">
            {{ treeControl.isExpanded(node) ? '-' : '+' }}
          </span>
          <mat-icon
            class="complex-three-title-icon mat-icon-rtl-mirror expandable no-file"
            [class.empty-tree-icon]="node.children.length === 0"
          >
            folder
          </mat-icon>
        </button>
        <a
          class="complex-three-title btn clickable"
          (click)="openFolderPDF(node.Id)"
          *ngIf="isGroupClickable(node)"
        >
          {{ node.Name }}
        </a>
        <span
          class="complex-three-title btn"
          [ngClass]="{
            'non-clickable': !hasContent(node),
            'non-clickable-filled': hasContent(node)
          }"
          *ngIf="!isGroupClickable(node)"
          [matTooltip]="'complex.noInfo' | translate: 'Отсутствует информация по теме'"
          [matTooltipDisabled]="hasContent(node)"
          matTooltipPosition="right"
        >
          {{ node.Name }}
        </span>
        <div class="work-icons" *ngIf="isLecturer">
          <a
            class="btn clickable"
            (click)="openEditPopup(node)"
            [matTooltip]="'common.edit' | translate: 'Редактировать'"
            matTooltipPosition="below"
            *ngIf="!isMandatoryComponent(node) && !node.TestId"
          >
            <span class="btn clickable"
              ><mat-icon class="icon">edit</mat-icon></span
            >
          </a>
          <a
            class="btn clickable"
            (click)="openConfirmationDialog(node.Id, node)"
            [matTooltip]="'common.delete' | translate: 'Удалить'"
            matTooltipPosition="below"
          >
            <span class="btn clickable"
              ><mat-icon class="icon">delete</mat-icon></span
            >
          </a>
        </div>
      </div>
      <div class="drop-indicator" *ngIf="dropIndicatorNodeId === +node.Id"></div>
      <ul
        [class.example-tree-invisible]="!treeControl.isExpanded(node)"
        class="contents"
      >
        <ng-container matTreeNodeOutlet></ng-container>
      </ul>
    </li>
  </mat-nested-tree-node>
</mat-tree>
